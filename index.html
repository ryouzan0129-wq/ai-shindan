<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AI超精密性格診断</title>
  <meta name="description" content="最新AIがあなたを多角的に分析します。">

  <!-- テーマカラー（ダーク/ライト） -->
  <meta name="theme-color" content="#0B0E1A" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#F4F6FB" media="(prefers-color-scheme: light)">
  <meta name="color-scheme" content="dark light">

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./assets/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AI性格診断">

  <!-- OGP（シェア時のプレビュー） -->
  <meta property="og:title" content="AI超精密性格診断">
  <meta property="og:description" content="最新AIがあなたを多角的に分析します。">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">

  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <!--
    アプリシェル構造
    ─────────────────────────────
    #hud      : 常時ヘッダー（回答数・時間・分析中テーマ・終了ボタン）
    #screen   : 画面本体。script.js の Router が home / question /
                interstitial / share を描画する
    #ai-log   : 装飾用AIログティッカー（スクリーンリーダーからは隠す）
    #quit-dialog : 終了確認シート（段階表示・必ず終了できる）
    #toast    : 称号到達などの控えめな通知
  -->
  <div id="app">

    <header id="hud" hidden>
      <div class="hud-main">
        <span class="hud-item">
          <span class="hud-label">回答済み</span>
          <b class="num hud-count-box"><span id="hud-count">0</span></b><span class="hud-unit">問</span>
        </span>
        <span class="hud-theme-wrap">
          <span id="hud-phase" class="hud-phase"></span>
          <b id="hud-theme">—</b>
        </span>
        <button id="btn-quit" class="btn btn-ghost btn-sm" type="button">診断を終了</button>
      </div>
      <div class="hud-sub" aria-hidden="true">
        <span id="hud-status"></span>
        <span class="hud-prog">解析進行度 <b id="hud-progress" class="num">—</b></span>
      </div>
      <div class="hud-gauge" aria-hidden="true"><i id="hud-gauge-fill"></i></div>
    </header>

    <main id="screen" tabindex="-1">
      <!-- Router が描画。JS無効時のフォールバック： -->
      <noscript>
        <div class="screen">
          <section class="card glass" style="margin:auto; text-align:center;">
            <h1>AI超精密性格診断</h1>
            <p>この診断の実行には JavaScript が必要です。<br>ブラウザの設定を確認してください。</p>
          </section>
        </div>
      </noscript>
    </main>

    <footer id="ai-log" aria-hidden="true">
      <span id="ai-log-text"></span>
    </footer>
  </div>

  <!-- 終了確認：最終ボタンは必ず終了する（ボタン位置固定・入れ替えなし） -->
  <dialog id="quit-dialog" aria-labelledby="quit-title">
    <div class="dlg-card glass">
      <h2 id="quit-title" class="dlg-title">診断を終了</h2>
      <div id="quit-body" class="dlg-body"><!-- JSが段階テキストを描画 --></div>
      <div class="dlg-actions">
        <button id="quit-back" class="btn btn-secondary" type="button">分析にもどる</button>
        <button id="quit-confirm" class="btn btn-primary" type="button">終了する</button>
      </div>
    </div>
  </dialog>

  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="./script.js" defer></script>
</body>
</html>
